name: NSE BTST Daily Signals

on:
  schedule:
    - cron: '30 11 * * 1-5'   # 5:00 PM IST = 11:30 UTC Mon-Fri
  workflow_dispatch:
    inputs:
      bhavcopy_url:
        description: 'Custom bhavcopy URL (leave empty to fetch from NSE automatically)'
        required: false
        default: ''

      session_date:
        description: 'Trading session date in YYYY-MM-DD (defaults to current IST date)'
        required: false
        default: ''
      from_date:
        description: 'Optional first date for historical bhavcopy backfill (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 120      # increased: handles up to 500 configs safely

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests pyarrow openpyxl

      - name: Download NSE equity bhavcopies
        env:
          BHAVCOPY_URL: ${{ github.event.inputs.bhavcopy_url }}
          SESSION_DATE: ${{ github.event.inputs.session_date }}
          FROM_DATE: ${{ github.event.inputs.from_date }}
        run: |
          SESSION_DATE=${SESSION_DATE:-$(TZ=Asia/Kolkata date +%F)}
          if [[ ! "$SESSION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Session date must use YYYY-MM-DD."
            exit 1
          fi
          echo "BTST_SESSION_DATE=$SESSION_DATE" >> "$GITHUB_ENV"

          args=(--session-date "$SESSION_DATE")
          if [ -n "$FROM_DATE" ]; then
            args+=(--from-date "$FROM_DATE")
          fi

          if [ -n "$BHAVCOPY_URL" ]; then
            if [ -n "$FROM_DATE" ]; then
              echo "Use the NSE archive for date-range backfills."
              exit 1
            fi
            mkdir -p bhav_data
            curl -fsSL "$BHAVCOPY_URL" -o "bhav_data/${SESSION_DATE}.csv"
          else
            python src/nse_bhavcopy_fetch.py "${args[@]}"
          fi

      - name: Step 1 - Consolidate bhavcopy data
        run: python src/01_consolidate_csv.py

      - name: Cleanup raw bhav CSVs (keep repo small)
        run: |
          find bhav_data/ -name "*.csv" -delete || true
          echo "Bhav CSVs removed"

      - name: Step 2 - Filter EQ data
        run: python src/02_filter_eq.py

      - name: Verify EQ data includes the requested trading session
        run: |
          python - <<'PYTHON'
          import os
          from datetime import date

          import pandas as pd

          expected = date.fromisoformat(os.environ["BTST_SESSION_DATE"])
          dates = pd.to_datetime(pd.read_parquet("db/eq_data.parquet", columns=["DATE1"])["DATE1"])
          if not dates.eq(pd.Timestamp(expected)).any():
              raise SystemExit(f"Missing EQ data for {expected}. Latest available date: {dates.max().date()}")
          PYTHON

      - name: Step 3 - Compute ATH
        run: python src/03_find_ath.py

      - name: Step 4 - Run daily signals (today only)
        run: python src/04_run_daily_signals.py

      - name: Step 5 - Run simulation & generate per-config JSON files
        run: python src/05_run_simulation.py

      - name: Step 6 - Prune data older than 2 years (rolling window)
        run: python src/prune_old_data.py

      - name: Fetch latest Nifty index data
        run: |
          mkdir -p docs/data
          curl -sf "https://spurandhar0.github.io/nse-btst-dashboard/nifty_index.json" \
            -o docs/data/nifty_index.json \
            && echo "Fetched nifty_index.json" \
            || echo "Failed to fetch nifty_index.json (using existing)"

      - name: Step 7 - Build dashboard
        run: python src/05_build_dashboard.py

      - name: Check disk usage before push
        run: |
          echo "=== Disk usage ==="
          du -sh db/ docs/data/ bhav_data/ output/ 2>/dev/null || true
          echo "=== docs/data file count ==="
          ls docs/data/ | wc -l

      - name: Push dashboard to public repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd /tmp
          git clone https://x-access-token:${GH_PAT}@github.com/spurandhar0/nse-btst-signals-dashboard.git pub-dashboard
          mkdir -p pub-dashboard/docs/data

          # index.html — always required
          cp $GITHUB_WORKSPACE/docs/index.html pub-dashboard/docs/index.html

          # sim_results per-config JSON files (one per config, MTF filtered)
          for cfg_file in $GITHUB_WORKSPACE/docs/data/sim_results_C*.json; do
            [ -f "$cfg_file" ] && cp "$cfg_file" pub-dashboard/docs/data/ || true
          done

          # Remove any C*.json files in public repo that no longer exist here (stale configs)
          for pub_file in pub-dashboard/docs/data/sim_results_C*.json; do
            [ -f "$pub_file" ] || continue
            base=$(basename "$pub_file")
            [ -f "$GITHUB_WORKSPACE/docs/data/$base" ] || rm -f "$pub_file"
          done

          # sim_meta.json
          [ -f "$GITHUB_WORKSPACE/docs/data/sim_meta.json" ] \
            && cp $GITHUB_WORKSPACE/docs/data/sim_meta.json pub-dashboard/docs/data/sim_meta.json \
            || echo "sim_meta.json not found — skipping"

          # trade_ohlc.json
          [ -f "$GITHUB_WORKSPACE/docs/data/trade_ohlc.json" ] \
            && cp $GITHUB_WORKSPACE/docs/data/trade_ohlc.json pub-dashboard/docs/data/trade_ohlc.json \
            || echo "trade_ohlc.json not found — skipping"

          # nifty_index.json
          [ -f "$GITHUB_WORKSPACE/docs/data/nifty_index.json" ] \
            && cp $GITHUB_WORKSPACE/docs/data/nifty_index.json pub-dashboard/docs/data/nifty_index.json \
            || true

          # Never push the legacy sim_results.json (removed — causes >100MB file limit)
          rm -f pub-dashboard/docs/data/sim_results.json

          cd pub-dashboard
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "Nothing to push to public repo" || git commit -m "Dashboard update: $(date +'%Y-%m-%d')"
          git push origin main

      - name: Commit private repo data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git rebase origin/main || (git rebase --abort && git merge -X theirs origin/main) || true
          # Remove legacy sim_results.json from git tracking if still present
          git rm --cached docs/data/sim_results.json 2>/dev/null || true
          git add bhav_data/ db/ docs/data/ src/prune_old_data.py || true
          find output/ -maxdepth 3 \( -name "*.csv" -o -name "*.json" -o -name ".gitignore" \) | xargs git add 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" || git commit -m "Daily signals + simulation + 2yr prune: $(date +'%Y-%m-%d')"
          git push origin HEAD:main
